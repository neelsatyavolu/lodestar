name: Deploy fares service

# The web app deploys through Vercel's GitHub integration. This deploys the
# Python fares container (fares/) to Cloudflare when it changes on main.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (token permissions: Workers Scripts Edit, Containers Edit, Workers Routes Edit).

on:
  push:
    branches: [main]
    paths: ["fares/**", ".github/workflows/deploy-fares.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fares
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the fares deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Test before deploying
        if: steps.creds.outputs.ready == 'true'
        working-directory: fares
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy Worker and container
        if: steps.creds.outputs.ready == 'true'
        working-directory: fares/worker
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler deploy
